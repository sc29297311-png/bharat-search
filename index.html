<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bharat Search V2 - Google Killer</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;700;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9ff;--card:#ffffff;--b:#e5e7ff;--p:#FF6A00;--g:#138808}
*{margin:0;padding:0;box-sizing:border-box;font-family:Outfit,sans-serif}
body{background:radial-gradient(800px at 10% -10%, #FF993322, transparent),radial-gradient(800px at 90% 0%, #13880822, transparent), #fcfcff; min-height:100vh}
header{position:sticky;top:0;z-index:99;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:2px solid var(--b);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.tiranga-flag{width:42px;height:28px;border-radius:5px;border:1.5px solid #333;overflow:hidden;position:relative;display:grid;grid-template-rows:1fr 1fr 1fr;box-shadow:0 2px 8px #0002}
.tiranga-flag span:nth-child(1){background:#FF9933}
.tiranga-flag span:nth-child(2){background:#fff;display:flex;align-items:center;justify-content:center}
.tiranga-flag span:nth-child(3){background:#138808}
.chakra{width:16px;height:16px;border:1px solid #000080;border-radius:50%;position:relative}
.chakra::before{content:'';position:absolute;inset:2px;border:1px dotted #000080;border-radius:50%}
.container{max-width:800px;margin:auto;padding:14px}
.hero{background:#fff;border:2px solid var(--b);border-radius:24px;padding:20px;box-shadow:0 10px 30px #7c4dff11;text-align:center}
.hero h1{font-size:28px;background:linear-gradient(90deg,#FF6A00,#138808);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sBox{display:flex;gap:8px;margin-top:14px}
.sBox input{flex:1;padding:15px 16px;border-radius:14px;border:2px solid var(--b);font-size:16px;outline:none}
.sBox input:focus{border-color:#7c4dff}
.vBtn{padding:0 20px;border-radius:14px;border:none;background:linear-gradient(90deg,#FF9933,#FF6A00);color:#fff;font-weight:800;font-size:22px;cursor:pointer}
.micBig{margin-top:14px;width:100%;padding:16px;border-radius:16px;border:none;background:linear-gradient(90deg,#000,#222);color:#fff;font-weight:800;font-size:18px;cursor:pointer;letter-spacing:.5px}
.card{background:#fff;border:1.5px solid var(--b);border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 4px 20px #00000008}
.robotTitle{display:flex;gap:8px;align-items:center;font-weight:800;font-size:18px}
.rBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rBtn{padding:13px;border-radius:12px;border:none;font-weight:800;cursor:pointer}
.rBtn.b1{background:linear-gradient(90deg,#FF9933,#ff8c00);color:#fff}
.rBtn.b2{background:linear-gradient(90deg,#ff0040,#ff5e5e);color:#fff}
.rBtn.b3{background:linear-gradient(90deg,#138808,#1ecb1e);color:#fff;grid-column:span 2}
.blogOut{background:#0f1225;color:#e6e8ff;padding:14px;border-radius:12px;margin-top:10px;white-space:pre-wrap;font-size:13px;max-height:380px;overflow:auto;display:none;border:1px solid #2a2f5a}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.tool{background:#fff;border:1.5px solid var(--b);border-radius:14px;padding:12px;text-align:center;font-weight:700;cursor:pointer}
.tool:hover{border-color:#7c4dff;transform:translateY(-2px)}
footer{text-align:center;padding:20px;font-size:11px;opacity:.6}
</style>
</head>
<body>
<header>
<div class="logo"><div class="tiranga-flag"><span></span><span><div class="chakra"></div></span><span></span></div> Bharat Search V2</div>
<div><button onclick="location.reload()" style="padding:8px 14px;border-radius:99px;border:1.5px solid #e5e7ff;background:#fff;font-weight:800">Logout</button></div>
</header>
<div class="container">
<div class="hero">
<h1>🇮🇳 Google नहीं, Bharat बोलता है</h1>
<p style="opacity:.7;margin-top:4px">Voice + Diesel Robot + Yojana Finder • 100% Free</p>
<div class="sBox">
<input id="sInput" placeholder="बोलो या लिखो - जैसे लाडली बहना योजना">
<button class="vBtn" onclick="startVoice()">🎙️</button>
</div>
<button class="micBig" onclick="startVoice()">🎙️ बोलो भारत - बोल के Search करो</button>
<p id="vStatus" style="font-size:12px;margin-top:8px;color:#7c4dff">Mic दबाओ - Robot Blog भी बनाएगा</p>
</div>

<div id="results"></div>

<div id="robotCard" class="card" style="display:none;border:2px solid #FF9933">
<div class="robotTitle">🤖 Bharat Diesel Robot <span style="font-size:11px;background:#fff0e0;padding:3px 8px;border-radius:99px">LIVE</span></div>
<p id="rTopic" style="font-size:12px;opacity:.7;margin:6px 0">Topic Ready है</p>
<div class="rBtns">
<button class="rBtn b1" onclick="runRobot('blog')">🚀 Blog + Article</button>
<button class="rBtn b2" onclick="runRobot('youtube')">📺 YouTube Pack</button>
<button class="rBtn b3" onclick="runRobot('yojana')">🏛️ Yojana / सरकारी Form निकालो</button>
</div>
<div id="blogOut" class="blogOut"></div>
<div style="display:flex;gap:6px;margin-top:8px">
<button onclick="copyBlog()" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid #e5e7ff;background:#fff;font-weight:700">📋 Copy</button>
<button onclick="shareBlog()" style="flex:1;padding:10px;border-radius:10px;border:none;background:#111;color:#fff;font-weight:700">📤 Share करो - Viral</button>
</div>
</div>

<h3 style="margin-top:18px">🔥 वायरल Tools</h3>
<div class="tools">
<div class="tool" onclick="go('calculator')">🧮<br>Calc</div>
<div class="tool" onclick="go('qr code')">🔳<br>QR</div>
<div class="tool" onclick="go('age')">🎂<br>Age</div>
<div class="tool" onclick="go('bmi')">⚖️<br>BMI</div>
</div>

</div>
<footer>© 2026 Bharat Search V2 - Made in Jabalpur, MP | Google Killer Edition</footer>

<script>
let currentTopic='', currentBlog='';
document.getElementById('sInput').addEventListener('input',async e=>{
 let q=e.target.value.trim(), r=document.getElementById('results'), rc=document.getElementById('robotCard');
 if(q.length<2){r.innerHTML='';rc.style.display='none';return}
 currentTopic=q;
 let h=`<div class="card">🔍 <b>${q}</b> - <a href="https://duckduckgo.com/?q=${q}" target="_blank" style="color:#7c4dff">DuckDuckGo पर देखो</a> | <a href="https://www.google.com/search?q=${q}" target="_blank">Google</a></div>`;
 try{let res=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q)); if(res.ok){let d=await res.json(); if(d.extract) h+=`<div class="card">📚 ${d.title}: ${d.extract.slice(0,180)}...</div>`}}catch{}
 r.innerHTML=h; rc.style.display='block'; document.getElementById('rTopic').innerText='Topic: '+q+' पर Robot तैयार है';
});
function go(q){document.getElementById('sInput').value=q; document.getElementById('sInput').dispatchEvent(new Event('input'))}
function startVoice(){
 if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){alert('Chrome में खोलो'); return;}
 let Recog=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=new Recog(); rec.lang='hi-IN';
 rec.onstart=()=>document.getElementById('vStatus').innerText='🎙️ सुन रहा हूँ...';
 rec.onresult=(e)=>{let t=e.results[0][0].transcript; document.getElementById('sInput').value=t; document.getElementById('vStatus').innerText='✅ बोला: '+t; document.getElementById('sInput').dispatchEvent(new Event('input'));};
 rec.start();
}
async function runRobot(type){
 let q=currentTopic||document.getElementById('sInput').value||'Bharat'; let out=document.getElementById('blogOut'); out.style.display='block'; out.innerText='🤖 Robot बना रहा है...';
 let wiki=''; try{let res=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q)); if(res.ok){let d=await res.json(); wiki=d.extract||''}}catch{wiki='Free source से जानकारी'}
 if(type=='blog'){
  currentBlog=`# ${q} - Complete Guide 2026 | Bharat Search V2\n\n${wiki}\n\n## ${q} क्या है?\n${q} पर ये Article Bharat Diesel Robot V2 ने Free Sources से बनाया है। SEO Ready, Copyright Free.\n\n## फायदे\n- 100% Free, No API\n- Jabalpur MP के लिए बना\n- Hindi + English\n\nMade in Bharat V2`;
 } else if(type=='youtube'){
  currentBlog=`🎬 YOUTUBE PACK FOR: ${q}\n\nTITLE: ${q} - Full Guide 2026 | Bharat Search V2\n\nDESCRIPTION:\n${wiki}\n\nइस वीडियो में ${q} के बारे में पूरी जानकारी दी गई है।\n\nHashtags: #${q.replace(/\s/g,'')} #BharatSearch #Jabalpur #MP\nTags: ${q}, bharat search, ${q} 2026\n\nThumbnail Text: ${q.toUpperCase()} ?`;
 } else {
  currentBlog=`🏛️ YOJANA FINDER: ${q}\n\n${wiki}\n\n👉 सरकारी लिंक:\n1. https://www.myscheme.gov.in/search?query=${encodeURIComponent(q)}\n2. https://mp.gov.in/search?q=${encodeURIComponent(q)}\n3. DuckDuckGo: https://duckduckgo.com/?q=${encodeURIComponent(q)}+yojana+form+last+date\n\nकैसे Apply करें:\n- ऊपर लिंक खोलो\n- Form भरो\n- Jabalpur CSC से Submit करो\n\nBharat Search V2 - Yojana Robot`;
 }
 out.innerText=currentBlog;
}
function copyBlog(){navigator.clipboard.writeText(document.getElementById('blogOut').innerText); alert('Copied Viral!')}
function shareBlog(){if(navigator.share){navigator.share({title:currentTopic,text:document.getElementById('blogOut').innerText})}else{copyBlog()}}
</script>
</body>
 </html>
